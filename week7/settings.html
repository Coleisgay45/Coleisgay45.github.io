<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gender Care Resources</title>
    <link rel="stylesheet" href="wa6.css">
</head>
<body>
    <nav class="main-nav">
      <div class="nav-brand" style="text-align: center;">Settings</div>
      <button class="nav-toggle" type="button" aria-label="Toggle navigation menu" onclick="myClick()">
         <span>Menu</span>
         <span></span>
         <span></span>
     </button>
  <ul class="nav-menu">
    <li><a href="home.html">Home</a></li>
    <li><a href="resources.html">Resources</a></li>
    <li><a href="#events">Events</a></li>
    <li><a href="settings.html">Settings</a></li>
  </ul>
</nav>

<div class="a11y-controls">
  <label for="font-size-select">Font Size:</label>
  <select id="font-size-select">
    <option value="small">Small</option>
    <option value="medium">Medium</option>
    <option value="large">Large</option>
  </select>
</div>

<script>
      const navToggle = document.querySelector('.nav-toggle');
      const navMenu = document.querySelector('.nav-menu');

      function myClick() {
        navMenu.classList.toggle('show');

        const isExpanded = navToggle.getAttribute('aria-expanded') === 'true' || false;
        navToggle.setAttribute('aria-expanded', !isExpanded);

        navToggle.classList.toggle('open');
      }

      navToggle.addEventListener('keydown', function(e) {
        if (e.code === 'Space' || e.code === 'Enter' || e.key === ' ') {
          e.preventDefault();
          myClick();
        }
      });

      document.addEventListener('DOMContentLoaded', () => {

    // Accessibility settings integration
    const fontSize = localStorage.getItem('fontSize') || 'medium';
    const fontSizeMap = {
      small: '14px',
      medium: '18px',
      large: '22px'
    };
    const savedFontSize = localStorage.getItem('fontSize') || 'medium';
    document.documentElement.style.fontSize = fontSizeMap[savedFontSize];
    const fontSizeSelect = document.getElementById('font-size-select');
    if (fontSizeSelect) {
      fontSizeSelect.value = savedFontSize;
      fontSizeSelect.addEventListener('change', function() {
        const newSize = fontSizeSelect.value;
        localStorage.setItem('fontSize', newSize);
        document.documentElement.style.fontSize = fontSizeMap[newSize];
      });
    }


});

    </script>   
</body>
</html>
