<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gender Care Resources</title>
    <link rel="stylesheet" href="wa6.css">
</head>
<body>
    <nav class="main-nav">
      <div class="nav-brand" style="text-align: center;">Community Hub</div>
      <button class="nav-toggle" type="button" aria-label="Toggle navigation menu" onclick="myClick()">
         <span>Menu</span>
         <span></span>
         <span></span>
     </button>
  <ul class="nav-menu">
    <li><a href="/week7/home.html">Home</a></li>
    <li><a href="/week7/resources.html">Resources</a></li>
    <li><a href="#events">Events</a></li>
    <li><a href="/week7/settings.html">Settings</a></li>
  </ul>
</nav>

<script>
      const bgColor = localStorage.getItem('bgColor') || 'light';
      const bgColorMap = {
        light: { bg: '#ffffff', text: '#222222' },
        dark: { bg: '#121212', text: '#f4ecd8' },
        sepia: { bg: '#f4ecd8', text: '#5b4636' }
      };
      const fontSize = localStorage.getItem('fontSize') || 'medium';
      const fontSizeMap = {
        small: '14px',
        medium: '18px',
        large: '22px'
      };
      const savedBgColor = localStorage.getItem('bgColor') || 'light';
      document.body.style.backgroundColor = bgColorMap[savedBgColor].bg;
      const savedFontSize = localStorage.getItem('fontSize') || 'medium';
      document.querySelector("html").style.fontSize = fontSizeMap[savedFontSize];

      const navToggle = document.querySelector('.nav-toggle');
      const navMenu = document.querySelector('.nav-menu');

      function myClick() {
        navMenu.classList.toggle('show');

        const isExpanded = navToggle.getAttribute('aria-expanded') === 'true' || false;
        navToggle.setAttribute('aria-expanded', !isExpanded);

        navToggle.classList.toggle('open');
      }

      navToggle.addEventListener('keydown', function(e) {
        if (e.code === 'Space' || e.code === 'Enter' || e.key === ' ') {
          e.preventDefault();
          myClick();
        }
      });
    </script>   
</body>
</html>
