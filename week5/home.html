<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gender Care Resources</title>
    <link rel="stylesheet" href="wa5.css">
    <script>
      const navToggle = document.querySelector('.nav-toggle');
      const navMenu = document.querySelector('.nav-menu');

      function myClick() {
        navMenu.classList.toggle('show');
        navToggle.classList.toggle('hide');
        navMenu.style.display = "block";
        navToggle.style.display = "none";

        const isExpanded = navToggle.getAttribute('aria-expanded') === 'true' || false;
        navToggle.setAttribute('aria-expanded', !isExpanded);

        navToggle.classList.toggle('open');
      }

    </script>
</head>
<body>
    <nav class="main-nav">
      <div class="nav-brand">Community Hub</div>
      <button class="nav-toggle" aria-label="Toggle navigation menu" onclick="myClick()">
         <span>Menu</span>
         <span></span>
         <span></span>
     </button>
  <ul class="nav-menu">
    <li><a href="#home">Home</a></li>
    <li><a href="#resources">Resources</a></li>
    <li><a href="#events">Events</a></li>
    <li><a href="#contact">Contact</a></li>
  </ul>
</nav>
</body>
</html>
