<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gender Care Resources</title>
    <link rel="stylesheet" href="wa6.css">
</head>
<body>
  <nav class="main-nav">
      <div class="nav-brand" style="text-align: center;">Settings</div>
      <button class="nav-toggle" type="button" aria-label="Toggle navigation menu" onclick="myClick()">
         <span>Menu</span>
         <span></span>
         <span></span>
     </button>
  <ul class="nav-menu">
    <li><a href="/week7-8/home.html">Home</a></li>
    <li><a href="/week7-8/resources.html">Resources</a></li>
    <li><a href="/week7-8/settings.html">Settings</a></li>
  </ul>
</nav>

<div class="a11y-controls">
  <button type="button" onclick="clear()">Reset to Default</button>
   <!-- <button type="button" onclick="alert('clicked')">Test Button</button> -->
  <hr>
  <label for="font-size-select">Font Size:</label>
  <select id="font-size-select">
    <option value="small">Small</option>
    <option value="medium">Medium</option>
    <option value="large">Large</option>
  </select>
  <p> </p>
  <label for="background-color-select">Background Color:</label>
  <select id="background-color-select">
    <option value="light">Light</option>
    <option value="dark">Dark</option>
    <option value="sepia">Sepia</option>
  </select>
</div>

<script>
  const navToggle = document.querySelector('.nav-toggle');
  const navMenu = document.querySelector('.nav-menu');

function myClick() {
  if (!navToggle || !navMenu) return;
  navMenu.classList.toggle('show');
  const isExpanded = navToggle.getAttribute('aria-expanded') === 'true' || false;
  navToggle.setAttribute('aria-expanded', !isExpanded);
  navToggle.classList.toggle('open');
}

if (navToggle) {
  navToggle.addEventListener('keydown', function(e) {
    if (e.code === 'Space' || e.code === 'Enter' || e.key === ' ') {
      e.preventDefault();
      myClick();
    }
  });
}

//clearing the localstorage
function clear() {
  console.log("Reset button clicked");
  localStorage.removeItem('fontSize');
  localStorage.removeItem('bgColor');
  location.reload();
}

document.addEventListener('DOMContentLoaded', () => {
  // Font size
  const fontSizeMap = {
    small: '14px',
    medium: '18px',
    large: '22px'
  };
  const fontSizeSelect = document.getElementById('font-size-select');
  let savedFontSize = localStorage.getItem('fontSize');
  if (!savedFontSize) {
    savedFontSize = 'medium'; // fallback to default
    if (fontSizeSelect) fontSizeSelect.value = 'medium';
  }
  document.querySelector("html").style.fontSize = fontSizeMap[savedFontSize];
  if (fontSizeSelect) {
    fontSizeSelect.value = savedFontSize;
    fontSizeSelect.addEventListener('change', function() {
      const newSize = fontSizeSelect.value;
      localStorage.setItem('fontSize', newSize);
      document.querySelector("html").style.fontSize = fontSizeMap[newSize];
    });
  }

  // Background color
  const bgColorMap = {
    light: { bg: '#ffffff', text: '#222222' },
    dark: { bg: '#121212', text: '#f4ecd8' },
    sepia: { bg: '#f4ecd8', text: '#5b4636' }
  };
  const bgColorSelect = document.getElementById('background-color-select');
  let savedBgColor = localStorage.getItem('bgColor');
  if (!savedBgColor) {
    savedBgColor = 'light'; // fallback to default
    if (bgColorSelect) bgColorSelect.value = 'light';
  }
  document.body.style.backgroundColor = bgColorMap[savedBgColor].bg;
  document.body.style.color = bgColorMap[savedBgColor].text;
  if (bgColorSelect) {
    bgColorSelect.value = savedBgColor;
    bgColorSelect.addEventListener('change', function() {
      const newColor = bgColorSelect.value;
      localStorage.setItem('bgColor', newColor);
      document.body.style.backgroundColor = bgColorMap[newColor].bg;
      document.body.style.color = bgColorMap[newColor].text;
    });
  }
});

</script>   
</body>
</html>
